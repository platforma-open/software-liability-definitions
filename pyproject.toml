[project]
name = "software-liability-definitions"
version = "0.1.0"
description = "The canonical antibody chemical-liability taxonomy, emitted as JSON. Definitions only, never a scan."
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
